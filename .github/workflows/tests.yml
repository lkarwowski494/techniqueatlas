# Testy i strażnicy repozytorium (anonimowość źródeł, sekrety i dane osobowe, brak analityki, generator). Bez sekretów, tylko odczyt treści; nic nie publikuje.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run dane
      - run: npm test
      - run: npm run build
